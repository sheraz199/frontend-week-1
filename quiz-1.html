<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 1 Quiz | Nexus Academy</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #0f172a; 
            --card-bg: #1e293b; 
            --accent-color: #0d6efd; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background-color: var(--primary-bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .quiz-header { padding: 30px; border-bottom: 1px solid var(--border-color); }
        .course-badge { color: #60a5fa; font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
        .progress-container { height: 8px; background-color: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 20px; overflow: hidden; }
        .progress-bar-custom { height: 100%; background-color: var(--accent-color); transition: width 0.3s ease; }

        .quiz-body { padding: 40px 30px; min-height: 350px; }
        .question-text { font-size: 1.5rem; font-weight: 700; margin-bottom: 30px; line-height: 1.4; }
        
        .option-btn {
            display: block; width: 100%; text-align: left;
            background-color: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 15px 20px; border-radius: 10px;
            margin-bottom: 15px; font-size: 1.1rem; transition: all 0.2s ease; cursor: pointer;
        }
        .option-btn:hover { background-color: rgba(255,255,255,0.08); }
        .option-btn.selected { background-color: rgba(13, 110, 253, 0.15); border-color: var(--accent-color); color: #fff; box-shadow: 0 0 0 2px rgba(13,110,253,0.3); }

        .navigator-section { padding: 0 30px 20px 30px; }
        .nav-box {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: 0.2s; 
            background: rgba(255,255,255,0.03); color: var(--text-muted);
        }
        .nav-box:hover { background: rgba(255,255,255,0.1); }
        .nav-box.answered { background: rgba(13, 110, 253, 0.2); border-color: var(--accent-color); color: #fff; }
        .nav-box.current { box-shadow: 0 0 0 2px #fff; border-color: #fff; color: #fff; }

        .quiz-footer {
            padding: 20px 30px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(0,0,0,0.1);
        }

        /* --- UPDATED RESULTS SCREEN STYLES --- */
        .results-screen { display: none; text-align: center; padding: 60px 30px; }
        
        .score-circle {
            width: 180px; height: 180px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin: 0 auto 30px auto; font-size: 2.2rem; font-weight: 800; border: 8px solid;
            background-color: rgba(0,0,0,0.2);
            line-height: 1;
        }
        .score-circle i { font-size: 3.5rem; margin-bottom: 5px; } /* Controls the giant Tick/Cross size */
        
        .score-pass { border-color: var(--success-color); color: var(--success-color); }
        .score-fail { border-color: var(--danger-color); color: var(--danger-color); }
        
        .btn-close-custom { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-close-custom:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="quiz-container position-relative">
        
        <i class="bi bi-x-lg btn-close-custom" onclick="closeQuiz()"></i>

        <div id="quizUI">
            <div class="quiz-header pt-4">
                <span class="course-badge">Module 1 Assessment</span>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <h3 class="mb-0 fw-bold">Web Architecture Basics</h3>
                    <span class="badge bg-secondary rounded-pill px-3 py-2" id="questionTracker">Question 1 of 20</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-custom" id="progressBar" style="width: 5%;"></div>
                </div>
            </div>

            <div class="quiz-body">
                <div class="question-text" id="questionText">Loading question...</div>
                <div id="optionsContainer">
                    </div>
            </div>

            <div class="navigator-section border-top pt-4">
                <h6 class="text-muted mb-3" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Question Navigator (Click to jump)</h6>
                <div id="questionNavigator" class="d-flex flex-wrap gap-2">
                    </div>
            </div>

            <div class="quiz-footer">
                <button class="btn btn-outline-light fw-bold px-4 rounded-pill" id="prevBtn" onclick="changeQuestion(-1)" disabled>
                    <i class="bi bi-arrow-left me-2"></i>Previous
                </button>
                <button class="btn btn-primary fw-bold px-4 rounded-pill" id="nextBtn" onclick="changeQuestion(1)">
                    Next<i class="bi bi-arrow-right ms-2"></i>
                </button>
                <button class="btn btn-success fw-bold px-4 rounded-pill d-none" id="submitBtn" onclick="submitQuiz()">
                    <i class="bi bi-check-circle-fill me-2"></i>Submit Quiz
                </button>
            </div>
        </div>

        <div id="resultsUI" class="results-screen">
            <h2 class="fw-bold mb-4" id="resultGreeting">Assessment Complete</h2>
            
            <div class="score-circle" id="scoreCircle">
                </div>
            
            <h4 class="text-white mb-3" id="scoreFraction">You scored 0 out of 20</h4>
            <p class="lead text-muted mb-5 px-md-5" id="resultMessage" style="font-size: 1.1rem;"></p>
            
            <div id="actionButtons">
                </div>
        </div>

    </div>

    <script>
        
        const quizData = [
            // --- LECTURE 1: ANATOMY OF THE WEB ---
            { 
                type: 'single', 
                q: "In the 'Restaurant Analogy' of web development, what does the 'Kitchen' represent?", 
                options: ["The Frontend", "The User's Browser", "The Backend / Server", "The Graphic Design"], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "What is the primary role of an API (Application Programming Interface) in a web application?", 
                options: ["It applies CSS styles to the website.", "It acts as a 'waiter', securely carrying requests from the frontend client to the backend database and returning the data.", "It encrypts user passwords.", "It creates the HTML structure."], 
                answer: 1 
            },
            { 
                type: 'multiple', 
                q: "Which of the following languages make up the 'Frontend Trio' used by browsers to render websites? (Select all that apply)", 
                options: ["Python", "HTML", "CSS", "JavaScript"], 
                answer: [1, 2, 3] 
            },
            { 
                type: 'single', 
                q: "When developers talk about hosting their website in 'The Cloud', what does that actually mean?", 
                options: ["The website is stored in a satellite orbiting Earth.", "The website is running entirely on the user's mobile phone.", "The website is hosted on physical servers rented from large datacenters owned by companies like Amazon, Google, or Microsoft.", "The website requires no hardware to run."], 
                answer: 2 
            },

            // --- LECTURE 2: THE REQUEST/RESPONSE CYCLE ---
            { 
                type: 'single', 
                q: "What is the role of the Domain Name System (DNS)?", 
                options: ["To encrypt HTTP requests.", "To act as the internet's phonebook, translating human-readable URLs (like github.com) into computer-readable IP addresses.", "To paint pixels on the user's screen.", "To store website databases."], 
                answer: 1 
            },
            { 
                type: 'single', 
                q: "Which HTTP method is strictly used to fetch/read data from a server without modifying it?", 
                options: ["POST", "GET", "PUT", "DELETE"], 
                answer: 1 
            },
            { 
                type: 'single', 
                q: "What does an HTTP Status Code of '404' indicate?", 
                options: ["Success (Data saved)", "Server Error (The backend crashed)", "Client Error (The requested URL was not found)", "Unauthorized (User is not logged in)"], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "Why is HTTPS mandatory for modern web development instead of standard HTTP?", 
                options: ["HTTPS makes websites load faster.", "HTTPS allows for larger image sizes.", "HTTPS uses SSL/TLS encryption to scramble data, protecting sensitive information like passwords from hackers.", "HTTPS is required to use JavaScript."], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "What is the DOM (Document Object Model)?", 
                options: ["A database management system.", "The server-side language of the web.", "An upside-down 'tree' structure the browser builds by reading HTML line-by-line.", "A CSS framework."], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "Which of the following statements about the 'Render Tree' is TRUE?", 
                options: ["It is built before the HTML is downloaded.", "It only includes elements that will actually be visible on the screen (excluding elements with `display: none`).", "It contains only CSS, no HTML.", "It is stored on the backend server."], 
                answer: 1 
            },
            { 
                type: 'single', 
                q: "If a developer triggers a JavaScript animation that changes an element's `width`, the browser must recalculate the geometry of the entire page. What is this expensive browser phase called?", 
                options: ["DNS Resolution", "Layout", "Painting", "Data Fetching"], 
                answer: 1 
            },

            // --- LECTURE 3: HTML5 SEMANTICS ---
            { 
                type: 'single', 
                q: "Is HTML considered a programming language?", 
                options: ["Yes, because it can perform mathematical calculations.", "Yes, because it is used to build websites.", "No, it is a markup language used strictly to structure and describe content.", "No, it is a database query language."], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "Which specific tag must be at the very top of an HTML document to tell the browser it is using HTML5?", 
                options: ["<html>", "<head>", "<!DOCTYPE html>", "<meta charset='UTF-8'>"], 
                answer: 2 
            },
            { 
                type: 'multiple', 
                q: "Which of the following are modern HTML5 'Semantic' tags? (Select all that apply)", 
                options: ["<div>", "<header>", "<article>", "<span>"], 
                answer: [1, 2] 
            },
            { 
                type: 'single', 
                q: "Why is it an industry standard to always include the `alt` attribute inside an `<img>` tag?", 
                options: ["It tells the browser what size the image should be.", "It applies a border to the image.", "It provides a text description if the image fails to load, which is crucial for SEO and visually impaired users.", "It makes the image load faster."], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "Which tag combination correctly creates a numbered (ordered) list?", 
                options: ["<ul> and <li>", "<ol> and <li>", "<list> and <item>", "<dl> and <dt>"], 
                answer: 1 
            },
            { 
                type: 'single', 
                q: "In an HTML table, which tag is used to define a single Table Row?", 
                options: ["<td>", "<th>", "<tr>", "<table>"], 
                answer: 2 
            },
            { 
                type: 'single', 
                q: "When building an HTML `<form>`, what does the `action` attribute specify?", 
                options: ["The color of the submit button.", "The URL/endpoint where the form data should be sent when submitted.", "The HTTP method (GET or POST).", "The validation rules for the inputs."], 
                answer: 1 
            },
            { 
                type: 'single', 
                q: "What is the primary difference between a `<div>` and a `<span>`?", 
                options: ["A `<div>` is inline-level, a `<span>` is block-level.", "A `<div>` is block-level (takes full width, forces line breaks), while a `<span>` is inline-level (sits inside text without line breaks).", "A `<div>` is for text, a `<span>` is for images.", "There is no difference."], 
                answer: 1 
            },
            { 
                type: 'multiple', 
                q: "Which of the following are considered strict HTML best practices? (Select all that apply)", 
                options: ["Writing tags in uppercase (e.g., `<DIV>`).", "Indenting child elements inside their parent elements for readability.", "Closing tags in the reverse order they were opened (proper nesting).", "Using `<table>` tags to create the main layout of your webpage."], 
                answer: [1, 2] 
            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null); 

        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const tracker = document.getElementById('questionTracker');
        const progressBar = document.getElementById('progressBar');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const navGrid = document.getElementById('questionNavigator');

        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            questionText.innerText = `${currentQuestionIndex + 1}. ${currentData.q}`;
            tracker.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            const progressPercentage = ((currentQuestionIndex + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;

            optionsContainer.innerText = '';
            currentData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                if (userAnswers[currentQuestionIndex] === index) { btn.classList.add('selected'); }
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            prevBtn.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.classList.add('d-none');
                submitBtn.classList.remove('d-none');
            } else {
                nextBtn.classList.remove('d-none');
                submitBtn.classList.add('d-none');
            }
            renderNavigator();
        }

        function selectOption(selectedIndex, buttonElement) {
            userAnswers[currentQuestionIndex] = selectedIndex;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            allButtons.forEach(btn => btn.classList.remove('selected'));
            buttonElement.classList.add('selected');
            renderNavigator(); 
        }

        function changeQuestion(direction) {
            currentQuestionIndex += direction;
            loadQuestion();
        }

        function renderNavigator() {
            navGrid.innerText = '';
            for (let i = 0; i < quizData.length; i++) {
                const box = document.createElement('div');
                box.className = 'nav-box';
                box.innerText = i + 1;
                if (i === currentQuestionIndex) box.classList.add('current');
                if (userAnswers[i] !== null) box.classList.add('answered');
                box.onclick = () => { currentQuestionIndex = i; loadQuestion(); };
                navGrid.appendChild(box);
            }
        }

        // --- UPDATED SUBMIT FUNCTION (CUSTOM MESSAGES & ICONS) ---
        function submitQuiz() {
            const skippedQuestions = userAnswers.filter(a => a === null).length;
            if (skippedQuestions > 0) {
                const confirmSubmit = confirm(`Wait! You have ${skippedQuestions} unattempted questions. Are you sure you want to submit your quiz?`);
                if (!confirmSubmit) return; 
            }

            let score = 0;
            for (let i = 0; i < quizData.length; i++) {
                if (userAnswers[i] === quizData[i].answer) score++;
            }
            const percentage = Math.round((score / quizData.length) * 100);

            document.getElementById('quizUI').style.display = 'none';
            document.getElementById('resultsUI').style.display = 'block';

            const scoreCircle = document.getElementById('scoreCircle');
            const resultMessage = document.getElementById('resultMessage');
            const actionButtons = document.getElementById('actionButtons');
            
            document.getElementById('scoreFraction').innerText = `You scored ${score} out of ${quizData.length}`;

            if (percentage >= 70) {
                // PASSING SCENARIO
                scoreCircle.className = "score-circle score-pass shadow-lg";
                scoreCircle.innerHTML = `<i class="bi bi-check-circle-fill"></i><span>${percentage}%</span>`;
                
                resultMessage.innerHTML = "<strong class='text-white'>Outstanding work!</strong> You have successfully demonstrated your understanding of the Web Architecture fundamentals. You are fully prepared to advance to the next stage of the course.";
                
                actionButtons.innerHTML = `<button class="btn btn-success fw-bold px-5 py-3 rounded-pill shadow-lg" onclick="takeNextStep()">
                                              Take the Next Step <i class="bi bi-rocket-takeoff-fill ms-2"></i>
                                           </button>`;
            } else {
                // FAILING SCENARIO
                scoreCircle.className = "score-circle score-fail shadow-lg";
                scoreCircle.innerHTML = `<i class="bi bi-x-circle-fill"></i><span>${percentage}%</span>`;
                
                resultMessage.innerHTML = "<strong class='text-white'>Don't give up!</strong> You didn't quite hit the 70% passing mark required. Review your notes, revisit the module materials, and try again when you are ready.";
                
                actionButtons.innerHTML = `<button class="btn btn-danger fw-bold px-5 py-3 rounded-pill shadow-lg" onclick="retryQuiz()">
                                              <i class="bi bi-arrow-clockwise me-2"></i> Retry Quiz
                                           </button>`;
            }
        }

        // --- NEW: RETRY ENGINE ---
        function retryQuiz() {
            // Reset all data
            currentQuestionIndex = 0;
            userAnswers = new Array(quizData.length).fill(null);
            
            // Swap screens back
            document.getElementById('resultsUI').style.display = 'none';
            document.getElementById('quizUI').style.display = 'block';
            
            // Reload the first question
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- NEW: NEXT STEP ENGINE ---
        function takeNextStep() {
            // Closes the modal and goes back to the dashboard, or you can route them to the next module
            if (window.self !== window.top) {
                parent.document.querySelector('.btn-close').click();
            } else {
                window.location.href = "https://pk.nexus-academy.site/course-room"; 
            }
        }

        function closeQuiz() {
            if (window.self !== window.top) {
                parent.document.querySelector('.btn-close').click();
            } else {
                window.location.href = "https://pk.nexus-academy.site/course-room"; 
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
